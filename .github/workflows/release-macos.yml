name: Sign and notarize macOS release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Eau preparation run ID
        required: true
        type: string
      publish:
        description: Publish the notarized package to Eau Releases
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macos-release-eau
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'sichengchen/macos-release' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    environment: macOS Release
    outputs:
      public_version: ${{ steps.publish.outputs.public_version }}
    env:
      SOURCE_REPO: sichengchen/eau
      SOURCE_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set the private working path
        run: printf 'RELEASE_WORK=%s/macos-release\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Get read access to the Eau build
        id: read
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: sichengchen
          repositories: eau
          permission-actions: read
          permission-contents: read

      - name: Verify and download the release build
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$RELEASE_WORK"
          if ! bash scripts/fetch-eau.sh > "$RELEASE_WORK/download.log" 2>&1; then
            echo "::error::Could not verify the Eau build. Check that the run succeeded on main and its release artifact is still available."
            exit 1
          fi

      - name: Sign, notarize, and verify the installer
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: bash scripts/sign-eau.sh

      - name: Get write access to Eau Releases
        if: inputs.publish
        id: write
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: sichengchen
          repositories: eau
          permission-contents: write

      - name: Publish to Eau Releases
        if: inputs.publish
        id: publish
        env:
          GH_TOKEN: ${{ steps.write.outputs.token }}
        run: |
          set -euo pipefail
          if ! bash scripts/publish-eau.sh > "$RELEASE_WORK/publish.log" 2>&1; then
            echo "::error::Could not publish to Eau. Check the app's existing tags, releases, and write permissions."
            exit 1
          fi
          echo "Published the notarized installer to the source repository."

  homebrew:
    name: Update the public Homebrew tap
    needs: release
    if: needs.release.outputs.public_version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: macOS Release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Get write access to the tap
        id: tap
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: sichengchen
          repositories: homebrew-tap
          permission-contents: write

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: sichengchen/homebrew-tap
          ref: main
          path: tap
          token: ${{ steps.tap.outputs.token }}

      - name: Update the Eau cask
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.public_version }}
        run: |
          set -euo pipefail
          [[ "$(gh api repos/sichengchen/eau --jq .visibility)" == public ]]
          latest=$(gh api repos/sichengchen/eau/releases/latest --jq .tag_name)
          if [[ "$latest" != "v$VERSION" ]]; then
            echo "A newer release is current. Keeping the tap on that release."
            exit 0
          fi
          asset="Eau-$VERSION-arm64.pkg"
          gh release download "v$VERSION" --repo sichengchen/eau \
            --pattern "$asset" --dir "$RUNNER_TEMP"
          sha="$(sha256sum "$RUNNER_TEMP/$asset" | awk '{print $1}')"
          python3 apps/eau/render-cask.py "$VERSION" "$sha" tap/Casks/eau.rb
          ruby -c tap/Casks/eau.rb
          git -C tap config user.name 'github-actions[bot]'
          git -C tap config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C tap add Casks/eau.rb
          if ! git -C tap diff --cached --quiet; then
            git -C tap commit -m "chore(cask): update eau to v$VERSION" \
              -m 'Co-Authored-By: Sicheng Chen (bot) <gh-bot@scchan.com>'
            git -C tap push origin HEAD:main
          fi
