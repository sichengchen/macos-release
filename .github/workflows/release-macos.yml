name: Sign and notarize macOS release

on:
  workflow_dispatch:
    inputs:
      app:
        description: App profile ID from the apps directory
        required: true
        type: string
      run_id:
        description: Successful preparation run ID
        required: true
        type: string
      publish:
        description: Publish the notarized package to the app repository
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macos-release-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'sichengchen/macos-release' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    environment: macOS Release
    outputs:
      public_version: ${{ steps.publish.outputs.public_version }}
    env:
      APP_ID: ${{ inputs.app }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set the private working path
        run: printf 'RELEASE_WORK=%s/macos-release\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Resolve app profile
        id: app
        run: bash scripts/resolve-app.sh

      - name: Get read access to the build
        id: read
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ steps.app.outputs.owner }}
          repositories: ${{ steps.app.outputs.repository }}
          permission-actions: read
          permission-contents: read

      - name: Verify and download the release build
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$RELEASE_WORK"
          if ! bash scripts/fetch-build.sh > "$RELEASE_WORK/download.log" 2>&1; then
            echo "::error::Could not verify the build. Check that the run succeeded on the configured branch and its release artifact is still available."
            exit 1
          fi

      - name: Sign, notarize, and verify the installer
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: bash scripts/sign-release.sh

      - name: Get write access to the app repository
        if: inputs.publish
        id: write
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ steps.app.outputs.owner }}
          repositories: ${{ steps.app.outputs.repository }}
          permission-contents: write

      - name: Publish to the app repository
        if: inputs.publish
        id: publish
        env:
          GH_TOKEN: ${{ steps.write.outputs.token }}
        run: |
          set -euo pipefail
          if ! bash scripts/publish-release.sh > "$RELEASE_WORK/publish.log" 2>&1; then
            echo "::error::Could not publish the release. Check the app's existing tags, releases, and write permissions."
            exit 1
          fi
          echo "Published the notarized installer to the source repository."

  homebrew:
    name: Update the public Homebrew tap
    needs: release
    if: needs.release.outputs.public_version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: macOS Release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Get write access to the tap
        id: tap
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: sichengchen
          repositories: homebrew-tap
          permission-contents: write

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: sichengchen/homebrew-tap
          ref: main
          path: tap
          token: ${{ steps.tap.outputs.token }}

      - name: Update the app cask
        env:
          APP_ID: ${{ inputs.app }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.public_version }}
        run: bash scripts/update-cask.sh
